name: Build Android widget

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/widget.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/widget.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleRelease
      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk macro-widget.apk
      - uses: actions/upload-artifact@v4
        with:
          name: macro-widget
          path: macro-widget.apk
      - name: Publish download
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: widget-v${{ github.run_number }}
          name: Macro Widget ${{ github.run_number }}
          body: Home screen widget for Macro Scanner. Download macro-widget.apk on your Android phone and open it to install.
          files: macro-widget.apk
          make_latest: true
