plugins {
    id 'com.android.application'
}

def buildNumber = Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')

android {
    namespace 'de.carmonavirus.macrowidget'
    compileSdk 35

    defaultConfig {
        applicationId 'de.carmonavirus.macrowidget'
        minSdk 26
        targetSdk 35
        versionCode buildNumber
        versionName "1.0.${buildNumber}"
    }

    // Every release must be signed with the same key, or Android refuses to update and you'd
    // have to uninstall first. The build workflow creates the key once and keeps it in the
    // Actions cache (never in this public repo); WIDGET_KEYSTORE points to it.
    def keystore = System.getenv('WIDGET_KEYSTORE')
    signingConfigs {
        widget {
            storeFile keystore ? file(keystore) : file("${System.getProperty('user.home')}/.android/debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystore ? signingConfigs.widget : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
