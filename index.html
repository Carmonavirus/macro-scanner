<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Scan food barcodes, log your meals and track your macros.">
  <title>Macro Scanner</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
  <script>try{var c=localStorage.getItem("themeCss");if(c){var s=document.createElement("style");s.id="theme-custom";s.textContent=c;document.head.appendChild(s)}}catch(e){}</script>
</head>
<body>
  <header class="topbar">
    <button class="topbar-back" id="btn-back" hidden aria-label="Back" data-icon="arrow-left"></button>
    <h1 id="title">Macro Scanner</h1>
  </header>

  <main id="view"></main>

  <nav class="tabbar" id="tabbar">
    <a href="#/" data-tab="diary"><span data-icon="notebook-pen"></span>Diary</a>
    <a href="#/reports" data-tab="reports"><span data-icon="chart-column"></span>Reports</a>
    <a href="#/recipes" data-tab="recipes"><span data-icon="chef-hat"></span>Recipes</a>
    <a href="#/shopping" data-tab="shopping"><span data-icon="shopping-cart"></span>Shopping</a>
    <a href="#/more" data-tab="more"><span data-icon="settings"></span>More</a>
  </nav>

  <div id="boot-error" hidden>
    <p id="boot-msg">The app didn’t load properly. This can happen right after an update.</p>
    <button type="button" id="boot-reload">Reload app</button>
  </div>
  <style>
    #boot-error { position: fixed; inset: auto 16px 96px; z-index: 50; background: #fff; color: #1f1f1f; border: 1px solid #e2e2e2; border-radius: 14px; padding: 16px; box-shadow: 0 8px 24px rgba(0,0,0,.18); font: 15px/1.45 system-ui, sans-serif; }
    #boot-error[hidden] { display: none; }
    #boot-error p { margin: 0 0 12px; }
    #boot-reload { font: inherit; font-weight: 600; background: #ab2200; color: #fff; border: 0; border-radius: 10px; padding: 10px 16px; min-height: 44px; }
  </style>
  <script>
    // Safety net: if the app hasn't started after a few seconds, offer a clean reload
    // that clears cached files and the offline worker (your diary data is NOT touched).
    (function () {
      var box = document.getElementById('boot-error');
      var show = function (msg) { if (msg) document.getElementById('boot-msg').textContent = msg; box.hidden = false; };
      window.addEventListener('dbblocked', function () {
        show('Macro Scanner is still open somewhere else (another Chrome tab or the installed app). Close it there, then tap Reload app.');
      });
      setTimeout(function () { if (!window.__booted) show(); }, 6000);
      document.getElementById('boot-reload').addEventListener('click', async function () {
        try {
          if (window.caches) { var keys = await caches.keys(); await Promise.all(keys.map(function (k) { return caches.delete(k); })); }
          if (navigator.serviceWorker) { var regs = await navigator.serviceWorker.getRegistrations(); await Promise.all(regs.map(function (r) { return r.unregister(); })); }
        } catch (e) { /* ignore */ }
        location.replace(location.pathname + '?r=' + Date.now() + location.hash);
      });
    })();
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
